# --- General Application Settings ---
spring.application.name=game-service
server.port=${PORT:8083}

# --- MongoDB Configuration (Modern URI Format) ---
# In 2026, using the URI is preferred for better compatibility with Mongo 5.6+

spring.data.mongodb.connection-string=mongodb://${MONGODB_USERNAME:vault_user}:\
${MONGODB_PASSWORD:vault_pass}@\
${MONGODB_HOST:localhost}:\
${MONGODB_PORT:27017}/\
vault_game?authSource=admin
# --- Redis Configuration ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.repositories.enabled=false

# --- RabbitMQ Configuration (AMQP 1.0 Ready) ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.connection-timeout=5000ms
spring.rabbitmq.publisher-confirm-type=correlated

# ADD THESE TWO LINES:
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# --- Service Discovery (Eureka) ---

# --- EUREKA ---
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- Firebase Configuration ---
# This looks for the file in src/main/resources
firebase.config.path=firebase-service-account.json

# This is your specific database URL
firebase.database.url=https://the-vault-646b0-default-rtdb.firebaseio.com/

# --- Custom Game Logic ---
game.grid.size=5
game.jackpot.base=500
game.jackpot.increment=50
game.timer.greed-seconds=30

# --- Logging Levels ---
logging.level.com.example.gameservice=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.data.mongodb=DEBUG
# Useful for monitoring the Jackson 3 JSON conversion
logging.level.org.springframework.http.converter.json=TRACE

# Add to both files
spring.cloud.inetutils.preferred-networks=192.168.0