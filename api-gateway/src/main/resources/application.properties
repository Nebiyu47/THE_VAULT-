spring.application.name=api-gateway
server.port=8080

# --- EUREKA ---
eureka.client.service-url.defaultZone=http://eureka:eureka@localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- REDIS ---
spring.data.redis.host=localhost
spring.data.redis.port=6380

# --- JWT ---
jwt.secret=${JWT_SECRET:YYPBM8vEIv7MT/NnPlIWFcRGZ6kp4K6+SQsCWboLnCE=}

# --- GLOBAL CORS (The "Front Door" Fix) ---
# These must be set so the browser allows the Angular app (4200) to talk to the Gateway (8080)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# --- DEDUPE FILTER (The "Double Header" Fix) ---
# This prevents the Gateway and Auth-Service from sending duplicate CORS headers, which causes Status 0
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# --- ROUTES ---

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Correct Circuit Breaker Configuration
spring.cloud.gateway.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[0]=CircuitBreaker=authService,forward:/fallback/auth

# LOBBY SERVICE
spring.cloud.gateway.routes[1].id=lobby-service
spring.cloud.gateway.routes[1].uri=lb://LOBBY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/lobby/**

## Fix the Circuit Breaker (Matches your Auth Service style)
#spring.cloud.gateway.routes[1].filters[0]=CircuitBreaker=lobbyService,forward:/fallback/lobby
#
## Fix the JWT Filter (Simple name reference)
#spring.cloud.gateway.routes[1].filters[1].name=JwtAuthentication

# GAME SERVICE
spring.cloud.gateway.routes[2].id=game-service
spring.cloud.gateway.routes[2].uri=lb://GAME-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/game/**
spring.cloud.gateway.routes[2].filters[0].name=JwtAuthentication

# GAME WEBSOCKETS
spring.cloud.gateway.routes[3].id=game-service-ws
spring.cloud.gateway.routes[3].uri=lb:ws://GAME-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/ws/game/**
spring.cloud.gateway.routes[3].filters[0].name=JwtAuthentication