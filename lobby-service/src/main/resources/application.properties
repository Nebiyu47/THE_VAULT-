# --- Spring Application ---
spring.application.name=lobby-service

# --- MongoDB Configuration (FIXED: Uses URI to avoid deprecation) ---
# Format: mongodb://user:pass@host:port/database?options
spring.data.mongodb.connection-string=mongodb://${MONGODB_USERNAME:vault_user}:\
${MONGODB_PASSWORD:vault_pass}@\
${MONGODB_HOST:localhost}:\
${MONGODB_PORT:27017}/\
vault_lobby?authSource=admin

# --- Redis Configuration ---
# Note: Using port 6380 as requested
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.repositories.enabled=false
# --- Server Configuration ---
server.port=${PORT:8082}

# --- Eureka Discovery Configuration ---
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
# Updated to use the secured URI format (user:pass@host)
eureka.client.service-url.defaultZone=${EUREKA_URI:http://eureka:eureka@localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# --- Custom Lobby Business Logic ---
lobby.room.code-length=6
lobby.room.max-players=8
lobby.room.min-players=2
lobby.room.idle-timeout=300
lobby.room.cleanup-interval=60000

# --- WebSocket & STOMP Configuration ---
websocket.topic.lobby=/topic/lobby
websocket.topic.game=/topic/game
websocket.app.prefix=/app
websocket.stomp.endpoint=/ws

# --- Logging Configuration ---
logging.level.com.vault.lobby=DEBUG
logging.level.org.springframework.web.socket=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n